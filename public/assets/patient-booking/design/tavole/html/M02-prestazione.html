<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Scelta prestazione</title>
<!-- Tavola M02-prestazione (390x1008) esportata da Claude Design. Stile inline identico all'originale. -->
<link rel="stylesheet" href="../../font/inter.css">
<style>
body{margin:0}
a{color:#00795f}a:hover{color:#006a51}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #00795f;outline-offset:2px}
</style>
<style>@page{size:390px 1008px;margin:0}html,body{margin:0;background:#ffffff}</style>
</head>
<body>
<div style="width: 390px; height: 1008px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f8fa; font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #1a1a2e;">

  <header style="background: #ffffff; border-bottom: 1px solid #e2e8f0;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px 6px; box-sizing: border-box;">
      <a href="M01-benvenuto.html" aria-label="Indietro" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #08364F; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
      <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #08364F; color: #ffffff; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: center; justify-content: center;">SC</div>
      <div style="min-width: 0; margin-left: 4px;">
        <div style="font-size: 15px; line-height: 20px; font-weight: 600; color: #08364F;">Poliambulatorio Santa Chiara</div>
        <div style="font-size: 13px; line-height: 18px; color: #64748b;">Empoli e Vinci</div>
      </div>
    </div>
    <div style="padding: 8px 16px 14px;">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;">
        <div style="height: 4px; border-radius: 999px; background: #00795f;"></div>
        <div style="height: 4px; border-radius: 999px; background: #e2e8f0;"></div>
        <div style="height: 4px; border-radius: 999px; background: #e2e8f0;"></div>
        <div style="height: 4px; border-radius: 999px; background: #e2e8f0;"></div>
        <div style="height: 4px; border-radius: 999px; background: #e2e8f0;"></div>
      </div>
      <p style="margin: 8px 0 0; font-size: 13px; line-height: 18px; color: #64748b;">Passo 1 di 5: <span style="color: #08364F; font-weight: 600;">Prestazione</span></p>
    </div>
  </header>

  <main style="padding: 20px 16px 150px; display: flex; flex-direction: column; gap: 20px;">

    <div>
      <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; color: #08364F;">Cosa ti serve?</h1>
      <p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: #64748b;">Durata e prezzo sono quelli indicati dallo studio. Paghi in studio.</p>
    </div>

    <div role="radiogroup" aria-label="Specialità" style="display: flex; gap: 8px; margin-right: -16px; overflow-x: auto; padding-right: 16px;">
      <button type="button" role="radio" aria-checked="true" style="flex-shrink: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px 0 12px; background: #e6f6f2; border: 1.5px solid #00795f; border-radius: 999px; font-size: 15px; line-height: 20px; font-weight: 600; color: #00795f; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Dermatologia</button>
      <button type="button" role="radio" aria-checked="false" style="flex-shrink: 0; min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 999px; font-size: 15px; line-height: 20px; font-weight: 500; color: #1a1a2e; cursor: pointer;">Cardiologia</button>
      <button type="button" role="radio" aria-checked="false" style="flex-shrink: 0; min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 999px; font-size: 15px; line-height: 20px; font-weight: 500; color: #1a1a2e; cursor: pointer;">Ortopedia</button>
      <button type="button" role="radio" aria-checked="false" style="flex-shrink: 0; min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 999px; font-size: 15px; line-height: 20px; font-weight: 500; color: #1a1a2e; cursor: pointer;">Fisioterapia</button>
    </div>

    <section aria-labelledby="lista" style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <h2 id="lista" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: #08364F;">Dermatologia</h2>
        <span style="font-size: 13px; line-height: 18px; color: #64748b;">3 prestazioni</span>
      </div>

      <div role="radiogroup" aria-labelledby="lista" style="display: flex; flex-direction: column; gap: 10px;">
        <button type="button" role="radio" aria-checked="true" style="width: 100%; text-align: left; cursor: pointer; display: flex; align-items: flex-start; gap: 14px; padding: 15px 15px 15px 19px; background: #ffffff; border: 2px solid #00795f; border-radius: 12px; color: #1a1a2e;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <span style="display: block; font-size: 16px; line-height: 24px; font-weight: 600; color: #1a1a2e;">Visita dermatologica</span>
            <span style="display: block; font-size: 14px; line-height: 20px; color: #64748b;">Prima visita o controllo della pelle e dei nei.</span>
            <span style="display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; font-size: 13px; line-height: 18px; color: #64748b;">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>30 min</span>
              <span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>In studio</span>
            </span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px; flex-shrink: 0;">
            <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 999px; background: #00795f; color: #ffffff; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
            <span style="font-size: 16px; line-height: 24px; font-weight: 600; color: #08364F; font-variant-numeric: tabular-nums;">100 €</span>
          </span>
        </button>

        <button type="button" role="radio" aria-checked="false" style="width: 100%; text-align: left; cursor: pointer; display: flex; align-items: flex-start; gap: 14px; padding: 16px 16px 16px 20px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; color: #1a1a2e;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <span style="display: block; font-size: 16px; line-height: 24px; font-weight: 600; color: #1a1a2e;">Mappatura dei nei (dermatoscopia)</span>
            <span style="display: block; font-size: 14px; line-height: 20px; color: #64748b;">Controllo dei nei con il dermatoscopio.</span>
            <span style="display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; font-size: 13px; line-height: 18px; color: #64748b;">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>40 min</span>
              <span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>In studio</span>
            </span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px; flex-shrink: 0;">
            <span aria-hidden="true" style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #64748b; background: #ffffff;"></span>
            <span style="font-size: 16px; line-height: 24px; font-weight: 600; color: #08364F; font-variant-numeric: tabular-nums;">140 €</span>
          </span>
        </button>

        <button type="button" role="radio" aria-checked="false" style="width: 100%; text-align: left; cursor: pointer; display: flex; align-items: flex-start; gap: 14px; padding: 16px 16px 16px 20px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; color: #1a1a2e;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <span style="display: block; font-size: 16px; line-height: 24px; font-weight: 600; color: #1a1a2e;">Prima visita in videochiamata</span>
            <span style="display: block; font-size: 14px; line-height: 20px; color: #64748b;">Un primo confronto con la dermatologa, da casa.</span>
            <span style="display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; font-size: 13px; line-height: 18px; color: #64748b;">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>20 min</span>
              <span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>In videochiamata</span>
            </span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px; flex-shrink: 0;">
            <span aria-hidden="true" style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #64748b; background: #ffffff;"></span>
            <span style="font-size: 16px; line-height: 24px; font-weight: 600; color: #08364F; font-variant-numeric: tabular-nums;">70 €</span>
          </span>
        </button>
      </div>
    </section>

    <button type="button" style="width: 100%; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px 14px 16px 20px; background: transparent; border: 1px dashed #cbd5e1; border-radius: 12px; color: #1a1a2e;">
      <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; background: #ffffff; border: 1px solid #e2e8f0; color: #08364F; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg></span>
      <span style="flex: 1; min-width: 0;">
        <span style="display: block; font-size: 15px; line-height: 22px; font-weight: 600; color: #1a1a2e;">Non sai cosa prenotare?</span>
        <span style="display: block; font-size: 14px; line-height: 20px; font-weight: 600; color: #00795f;">Chiedi allo studio</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg>
    </button>

  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; box-shadow: 0 -1px 0 #e2e8f0, 0 -8px 24px rgba(8,54,79,0.06); padding: 12px 16px 20px;">
    <div aria-live="polite" style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; line-height: 20px; font-weight: 600; color: #1a1a2e; font-variant-numeric: tabular-nums;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00795f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M20 6 9 17l-5-5"></path></svg>Visita dermatologica · 30 min · 100 €</div>
    <a href="M03-professionista.html" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; background: #00795f; color: #ffffff; font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none;">Continua<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
  </div>

</div>
</body>
</html>
