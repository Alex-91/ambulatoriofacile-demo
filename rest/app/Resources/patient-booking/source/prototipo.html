<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prenota una visita · Poliambulatorio Santa Chiara</title>
<meta name="description" content="Prototipo interattivo della prenotazione online dei pazienti di Ambulatorio Facile.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<!-- Nel prototipo Inter arriva da Google Fonts. In produzione il gestionale la ospita in locale
     (public/assets/fonts/inter/, file woff2) e non chiama Google: GDPR, brief §4.2. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKEN DEL BRAND (fonte: src/app/globals.css del sito, design-spec.md)
   ========================================================================== */
:root{
  --bg:#f6f8fa;            /* fondo pagina */
  --surface:#ffffff;       /* card, sheet, barre */
  --border:#e2e8f0;        /* hairline 1px delle card */
  --border-hover:#cbd5e1;  /* bordo in hover */
  --border-input:#8493a8;  /* bordo di campi e caselle: 3,1:1 su bianco (WCAG 1.4.11). Le card restano su #e2e8f0 */
  --ink:#1a1a2e;           /* testo primario */
  --muted:#64748b;         /* testo secondario su bianco (4,76:1) */
  --muted-bg:#5b6b80;      /* testo secondario sul fondo #f6f8fa: #64748b lì fa 4,47:1, sotto AA */
  --navy:#08364f;          /* titoli forti, giorno selezionato */
  --navy-hover:#0a4a6b;
  --cta:#00795f;           /* primario, link, testo teal (5,38:1 col bianco) */
  --cta-hover:#006a51;
  --accent:#00ac8d;        /* solo decorativo: pallini, segmenti, icone grandi. Mai sotto un testo */
  --tint:#e6f6f2;          /* selezioni e badge teal */
  --decor:#94a3b8;         /* icone e bordi disattivati, mai testo */
  --warn:#8a5600; --warn-bg:#fff4dc;
  --err:#b42318;  --err-bg:#fdecea;
  --info:#0067a1; --info-bg:#e8f2fa;
  --r-card:12px; --r-ctl:10px; --r-pill:999px; --r-sheet:16px;
  --raised:0 -1px 0 #e2e8f0, 0 -8px 24px rgba(8,54,79,.06); /* unica ombra: barra CTA e bottom sheet */
  --ease:cubic-bezier(.2,.8,.2,1);
  --dur:180ms;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --bar-h:0px;             /* altezza della barra CTA fissa, aggiornata dallo script */
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/24px var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,p,ul,ol,dl,dd,fieldset{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
legend{padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
a{color:var(--cta);text-underline-offset:3px;-webkit-tap-highlight-color:transparent}
a:hover{color:var(--cta-hover)}
img,svg{display:block}
[hidden]{display:none !important}
.tnum{font-variant-numeric:tabular-nums}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--cta);outline-offset:2px;border-radius:var(--r-ctl)}
.skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--navy);color:#fff;padding:12px 16px;border-radius:var(--r-ctl);font-weight:600;text-decoration:none}
.skip:focus{top:12px;color:#fff}

/* ===== Icone (stile Lucide, linea 1,75) ===== */
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:16px;height:16px}
.ico-lg{width:24px;height:24px}

/* ===== Layout ===== */
.wrap{width:100%;margin:0 auto;padding:0 16px}
@media (min-width:768px){.wrap{max-width:672px}}
@media (min-width:1024px){.wrap{max-width:1168px;padding:0 24px}}
.layout{flex:1;padding-top:20px}
.main{min-width:0;container:main / inline-size;padding-bottom:32px}
.side{display:none}
.cta-inline{display:none}
@media (min-width:1024px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:start;padding-top:32px}
  .side{display:block;position:sticky;top:88px}
  .cta-inline:not(:empty){display:block;margin-top:24px;max-width:360px}
}

/* ===== Testata dello studio ===== */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{display:flex;align-items:center;gap:4px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;min-height:44px;color:var(--navy);text-decoration:none;border-radius:var(--r-ctl);padding-right:4px}
.brand:hover{color:var(--navy)}
.mono{flex:none;width:36px;height:36px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 14px/1 var(--font);letter-spacing:.02em}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-name{font:600 15px/20px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font:400 13px/18px var(--font);color:var(--muted)}
/* Logo dello studio (aspetto.logo_url): alto 40 px su mobile e 48 px su desktop, mai più largo dello spazio libero */
.brand-logo{flex:0 1 auto;height:40px;width:auto;max-width:100%;min-width:0;object-fit:contain;object-position:left center}
@media (min-width:1024px){.brand-logo{height:48px}}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-ctl);color:var(--navy);transition:background-color var(--dur) var(--ease)}
.icon-btn:hover{background:var(--bg)}
.icon-btn[aria-disabled="true"]{color:var(--decor);cursor:not-allowed}
.icon-btn[aria-disabled="true"]:hover{background:none}
.topbar .icon-btn{margin-left:-10px}
.mie-btn{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;justify-content:center;padding:0 10px;border-radius:var(--r-ctl);color:var(--navy);font:500 14px/20px var(--font);margin-right:-10px}
.mie-btn:hover{background:var(--bg)}
.mie-btn[aria-current="page"]{color:var(--cta)}
.mie-txt{display:none}
@media (min-width:640px){.mie-txt{display:inline}.mie-btn{margin-right:0;border:1px solid var(--border);padding:0 14px}}
@media (max-width:479px){.topbar.has-back .mono{display:none}}

/* ===== Avanzamento a 5 segmenti ===== */
.progress{margin-bottom:20px}
.progress-bar{display:flex;gap:4px}
.seg{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background-color var(--dur) var(--ease)}
.seg.done{background:var(--accent)}
.seg.now{background:var(--cta)}
.progress-label{margin-top:8px;font:500 13px/18px var(--font);color:var(--muted-bg)}

/* ===== Tipografia ===== */
.eyebrow{font:600 13px/18px var(--font);color:var(--cta);margin-bottom:6px}
.title{font:600 24px/30px var(--font);color:var(--navy);letter-spacing:-.01em;margin-bottom:6px}
.title:focus-visible{outline-offset:4px}
.subtitle{font:400 15px/22px var(--font);color:var(--muted-bg);margin-bottom:20px;max-width:60ch}
.subtitle strong{color:var(--ink);font-weight:600}
@media (min-width:1024px){.title{font-size:30px;line-height:38px}.subtitle{font-size:16px;line-height:24px}}
.h2{font:600 18px/26px var(--font);color:var(--navy)}
.h3{font:600 16px/24px var(--font);color:var(--navy)}
.label-sec{font:600 13px/18px var(--font);color:var(--muted-bg);margin:24px 0 10px}
.micro{font:400 13px/18px var(--font);color:var(--muted)}
.on-bg .micro,.micro.on-bg{color:var(--muted-bg)}
.center{text-align:center}
.section{margin-top:24px}
.stack{display:grid;gap:12px}
.stack-sm{display:grid;gap:8px}
/* Griglie a una colonna: la colonna non si allarga mai oltre il contenitore (niente scroll orizzontale a 375). */
.stack,.stack-sm,.btn-row,.field,.rcards,.policy,.sum-list,.reassure,.contact-list,.sede-list,.trust,.actions,.menu,.timeline,.act-list,.move,.sheet-actions,.steps,.demo-row{grid-template-columns:minmax(0,1fr)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt32{margin-top:32px}

/* ===== Bottoni ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-ctl);border:1.5px solid transparent;font:600 16px/20px var(--font);text-decoration:none;text-align:center;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.btn-lg{min-height:52px}
.btn-block{display:flex;width:100%}
.btn-primary{background:var(--cta);color:#fff}
.btn-primary:hover{background:var(--cta-hover);color:#fff}
.btn-primary[aria-disabled="true"]{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--navy)}
.btn-secondary:hover{border-color:var(--border-hover);color:var(--navy);background:var(--surface)}
.btn-danger{background:var(--surface);border-color:#f1c4bf;color:var(--err)}
.btn-danger:hover{border-color:var(--err);color:var(--err)}
.btn-danger-solid{background:var(--err);color:#fff}
.btn-danger-solid:hover{background:#9a1d14;color:#fff}
.btn .spin{display:none}
.btn.is-busy{cursor:progress}
.btn.is-busy .spin{display:inline-block}
.btn.is-busy .btn-label{opacity:.85}
.btn-row{display:grid;gap:12px}
@media (min-width:640px){.btn-row.two{grid-template-columns:1fr 1fr}}
.link{color:var(--cta);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 2px;color:var(--cta);font:500 15px/20px var(--font);text-decoration:underline;text-underline-offset:3px;border-radius:6px}
.btn-link:hover{color:var(--cta-hover)}
.btn-link.danger{color:var(--err)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
.spin.dark{border-color:var(--border);border-top-color:var(--cta)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Card ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px}
.card-tight{padding:16px}
.card + .card{margin-top:12px}
.divider{height:1px;background:var(--border);margin:16px 0}

/* Card selezionabile: tutta la card è il bottone */
.opt{position:relative;width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px;min-height:72px;color:var(--ink);transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.opt:hover{border-color:var(--border-hover)}
.opt.is-selected{border-color:var(--cta);box-shadow:inset 0 0 0 1px var(--cta)}
.opt-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.opt-title{font:600 16px/24px var(--font);color:var(--ink)}
.opt-sub{font:400 14px/20px var(--font);color:var(--muted)}
.opt-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font:400 14px/20px var(--font);color:var(--muted)}
.opt-meta span{display:inline-flex;align-items:center;gap:6px}
.opt-meta .ico{width:16px;height:16px}
.opt-end{flex:none;color:var(--decor);display:grid;place-items:center}
.opt.is-selected .opt-end{color:var(--cta)}
.opt .badge{margin-top:8px;align-self:flex-start;white-space:normal;max-width:100%}
.opt-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);transition:border-color var(--dur) var(--ease)}
.opt-wrap:hover{border-color:var(--border-hover)}
.opt-wrap.is-selected{border-color:var(--cta);box-shadow:inset 0 0 0 1px var(--cta)}
.opt-wrap .opt{border:0;border-radius:var(--r-card) var(--r-card) 0 0;background:transparent;box-shadow:none}
.opt-foot{border-top:1px solid var(--border);padding:0 16px;display:flex}
.opt-foot a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font:500 14px/20px var(--font)}

/* Avatar con iniziali */
.avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--tint);color:var(--cta);display:grid;place-items:center;font:600 16px/1 var(--font);letter-spacing:.02em}
.avatar.navy{background:var(--navy);color:#fff}
.icon-tile{flex:none;width:48px;height:48px;border-radius:var(--r-card);background:var(--tint);color:var(--cta);display:grid;place-items:center}
.icon-tile .ico{width:24px;height:24px}
.icon-tile.neutral{background:var(--bg);color:var(--navy)}

/* ===== Badge di stato: icona + testo, mai solo colore ===== */
.badge{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:var(--r-pill);font:600 13px/18px var(--font);white-space:nowrap}
.badge .ico{width:14px;height:14px;stroke-width:2}
.badge-ok{background:var(--tint);color:var(--cta)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-err{background:var(--err-bg);color:var(--err)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}

/* ===== Avvisi in pagina ===== */
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-ctl);font:400 15px/22px var(--font)}
.note .ico{margin-top:1px}
.note p + p{margin-top:4px}
.note strong{font-weight:600}
.note-info{background:var(--info-bg);color:var(--info)}
.note-warn{background:var(--warn-bg);color:var(--warn)}
.note-err{background:var(--err-bg);color:var(--err)}
.note-ok{background:var(--tint);color:var(--cta)}
.note a{color:inherit;font-weight:600}

/* ===== Campi ===== */
.field{display:grid;gap:6px;margin-bottom:18px}
.label{font:500 14px/20px var(--font);color:var(--ink)}
.label .opt-txt,.legend .opt-txt{font-weight:400;color:var(--muted)}
.label-lg{display:block;font:600 16px/24px var(--font);color:var(--navy);margin-bottom:8px}
.hint{font:400 13px/18px var(--font);color:var(--muted);margin-top:-2px}
.input,.textarea{width:100%;height:52px;border:1px solid var(--border-input);border-radius:var(--r-ctl);background:var(--surface);padding:0 14px;font:400 16px/24px var(--font);color:var(--ink);transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);-webkit-appearance:none;appearance:none}
.textarea{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
.input::placeholder,.textarea::placeholder{color:var(--muted);opacity:1}
.input:hover,.textarea:hover{border-color:var(--navy)}
.input:focus,.textarea:focus{border-color:var(--cta);box-shadow:0 0 0 1px var(--cta)}
.input:focus-visible,.textarea:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
.has-error .input,.has-error .textarea,.input[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.error{display:flex;gap:6px;align-items:flex-start;font:500 14px/20px var(--font);color:var(--err)}
.error .ico{width:16px;height:16px;margin-top:2px;stroke-width:2}
.input[readonly]{background:var(--bg);border-color:var(--border)}
.grid-2{display:grid;gap:0 16px}
@media (min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}
.legend{font:600 16px/24px var(--font);color:var(--navy);margin-bottom:12px}

/* Cellulare con prefisso */
.phone{display:flex;align-items:stretch}
.phone-pre{display:grid;place-items:center;padding:0 14px;border:1px solid var(--border-input);border-right:0;border-radius:var(--r-ctl) 0 0 var(--r-ctl);background:var(--bg);font:500 16px/24px var(--font);color:var(--ink)}
.phone .input{border-radius:0 var(--r-ctl) var(--r-ctl) 0;font-variant-numeric:tabular-nums}
.has-error .phone-pre{border-color:var(--err)}

/* Ricerca */
.search-box{position:relative}
.search-box > .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.input-search{padding-left:44px;padding-right:48px}
.input-search::-webkit-search-cancel-button{display:none}
.search-box .clear{position:absolute;right:4px;top:4px}

/* Checkbox e radio nativi, ridisegnati */
.check{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:10px 0;cursor:pointer;font:400 15px/22px var(--font)}
.check input{flex:none;width:22px;height:22px;margin:0;margin-top:0;border:1.5px solid var(--border-input);border-radius:6px;background:var(--surface);-webkit-appearance:none;appearance:none;display:grid;place-items:center;cursor:pointer;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.check input::after{content:"";width:12px;height:7px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:var(--cta);border-color:var(--cta)}
.check input:checked::after{opacity:1}
.check input:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
.has-error .check input{border-color:var(--err)}

/* Chip (filtri, motivi, canale) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 20px;padding:2px 16px 4px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);color:var(--ink);font:500 15px/20px var(--font);white-space:nowrap;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.chip:hover{border-color:var(--border-hover)}
.chip[aria-pressed="true"],.chip.is-on{background:var(--tint);border-color:var(--cta);color:var(--cta)}
.chip .ico{width:16px;height:16px;stroke-width:2}
.chip-radio{position:relative}
.chip-radio input{position:absolute;opacity:0;width:1px;height:1px}
.chip-radio:focus-within{outline:2px solid var(--cta);outline-offset:2px}

/* Card radio (Per chi) */
.rcards{display:grid;gap:12px}
.rcard{display:flex;align-items:center;gap:14px;padding:16px;min-height:72px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);cursor:pointer;transition:border-color var(--dur) var(--ease)}
.rcard:hover{border-color:var(--border-hover)}
.rcard input{position:absolute;opacity:0;width:1px;height:1px}
.rcard:focus-within{outline:2px solid var(--cta);outline-offset:2px}
.rcard.is-selected{border-color:var(--cta);box-shadow:inset 0 0 0 1px var(--cta)}
.rcard-mark{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-input);display:grid;place-items:center}
.rcard.is-selected .rcard-mark{border-color:var(--cta);background:var(--cta)}
.rcard.is-selected .rcard-mark::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}

/* ===== Passo orario ===== */
.first-free{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:60px;border-radius:var(--r-card);border:1px solid var(--border);background:var(--surface);transition:border-color var(--dur) var(--ease)}
.first-free:hover{border-color:var(--cta)}
.first-free .icon-tile{width:36px;height:36px;border-radius:9px}
.first-free .icon-tile .ico{width:20px;height:20px}
.ff-label{display:block;font:500 13px/18px var(--font);color:var(--muted)}
.ff-val{display:block;font:600 15px/22px var(--font);color:var(--ink);font-variant-numeric:tabular-nums}
.first-free .opt-end{margin-left:auto}

.dt{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:20px}
@container main (min-width:600px){.dt.wide{grid-template-columns:304px minmax(0,1fr);gap:32px}}
.only-wide{display:none}
@media (min-width:1024px){.only-wide{display:block}.only-narrow{display:none}}

.nav-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav-title{font:600 16px/24px var(--font);color:var(--navy);text-transform:none}
.nav-btns{display:flex;gap:4px}
.nav-btns .icon-btn{border:1px solid var(--border);background:var(--surface)}
.nav-btns .icon-btn:hover{border-color:var(--border-hover)}

/* Striscia di 14 giorni (mobile e tablet) */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:start;width:56px;height:72px;border-radius:var(--r-card);border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.day:hover{border-color:var(--border-hover)}
.day-dow{font:500 13px/18px var(--font);color:var(--muted)}
.day-num{font:600 18px/24px var(--font);font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%}
.dot.posti{background:var(--accent)}
.dot.pochi{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.day[aria-checked="true"] .day-dow{color:#d5e1e9}
.day[aria-disabled="true"]{background:transparent;border-style:dashed;cursor:not-allowed}
.day[aria-disabled="true"] .day-num,.day[aria-disabled="true"] .day-dow{color:var(--decor)}
.day.is-empty:not([aria-checked="true"]) .day-num{color:var(--muted)}
.legend-row{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;font:400 13px/18px var(--font);color:var(--muted-bg)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row .dot.none{box-shadow:inset 0 0 0 1px var(--decor)}

/* Calendario mensile (desktop) */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px}
.cal-dow,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow span{text-align:center;font:500 13px/18px var(--font);color:var(--muted);padding:4px 0 6px}
.cal-day{position:relative;height:44px;border-radius:var(--r-ctl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 15px/20px var(--font);font-variant-numeric:tabular-nums;color:var(--ink);transition:background-color var(--dur) var(--ease)}
.cal-day:hover{background:var(--bg)}
.cal-day .dot{width:5px;height:5px}
.cal-day.is-empty{color:var(--muted)}
.cal-day[aria-checked="true"]{background:var(--navy);color:#fff}
.cal-day[aria-disabled="true"]{color:var(--decor);cursor:not-allowed}
.cal-day[aria-disabled="true"]:hover{background:none}
.cal-day.is-today::after{content:"";position:absolute;inset:3px;border:1px solid var(--border-hover);border-radius:8px;pointer-events:none}
.cal-day[aria-checked="true"].is-today::after{display:none}
.cal .legend-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}

/* Orari */
.day-head{margin-bottom:4px}
.slot-group + .slot-group{margin-top:16px}
.slot-label{font:600 13px/18px var(--font);color:var(--muted-bg);margin-bottom:8px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{height:48px;min-width:88px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--surface);color:var(--ink);font:500 16px/1 var(--font);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.slot:hover{border-color:var(--cta)}
.slot[aria-checked="true"]{background:var(--cta);border-color:var(--cta);color:#fff}
.slot .ico{width:16px;height:16px;stroke-width:2.25}
.slot.has-sede{flex-direction:column;gap:2px;height:60px}
.slot-sede{font:500 13px/16px var(--font);color:var(--muted)}
.slot[aria-checked="true"] .slot-sede{color:#fff}
.slot.is-current{border-style:dashed;color:var(--muted);cursor:default}
.slot.is-current:hover{border-color:var(--border)}
.slots-note{margin-top:16px}
.empty-day{text-align:left}

/* Banner della riserva (10 minuti dopo la verifica) */
.hold{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-ctl);background:var(--tint);color:var(--cta);font:500 14px/20px var(--font);margin-bottom:20px}
.hold strong{font-weight:600;font-variant-numeric:tabular-nums}
.hold.expired{background:var(--warn-bg);color:var(--warn);flex-wrap:wrap}
.hold.expired .btn-link{color:var(--warn);min-height:32px;margin-left:auto}
.hold.compact{margin:16px 0 0}

/* ===== Codice a 6 caselle ===== */
.otp{display:flex;gap:8px;margin:4px 0 12px}
.otp input{width:48px;height:56px;padding:0;text-align:center;border:1px solid var(--border-input);border-radius:var(--r-ctl);background:var(--surface);font:600 22px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--ink);transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);-webkit-appearance:none;appearance:none}
.otp input:nth-child(3){margin-right:8px}
.otp input:focus{border-color:var(--cta);box-shadow:0 0 0 1px var(--cta)}
.otp input:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
.otp.is-error input{border-color:var(--err)}
.otp input:disabled{background:var(--bg);border-color:var(--border);color:var(--muted)}
@media (max-width:359px){.otp{gap:6px}.otp input{width:42px}}
.resend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font:400 15px/22px var(--font);color:var(--muted-bg);min-height:44px}
.antibot{display:flex;align-items:center;gap:8px;font:400 13px/18px var(--font);color:var(--muted-bg);min-height:24px}
.antibot .ico{width:16px;height:16px;color:var(--cta)}
.antibot.is-on{color:var(--ink);font-weight:500}
.wa-to{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font:400 14px/20px var(--font);color:var(--muted)}
.wa-to strong{font-weight:600;color:var(--ink)}
.wa-bubble{margin-top:12px;padding:12px 14px;background:var(--tint);border-radius:12px 12px 4px 12px;font:400 16px/24px var(--font);color:var(--ink)}
.wa-qr{display:none}
@media (min-width:1024px){.wa-qr{display:flex;align-items:center;gap:16px;margin-top:12px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}.wa-qr svg{flex:none}}
.opt-title .badge{margin-left:6px;vertical-align:1px}
.trap{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}

/* ===== Riepilogo ===== */
.recap{padding:4px 20px}
.recap-row{display:flex;gap:14px;align-items:flex-start;padding:16px 0}
.recap-row + .recap-row{border-top:1px solid var(--border)}
.recap-row > .ico{color:var(--navy);margin-top:2px}
.recap-main{flex:1;min-width:0}
.recap-label{font:500 13px/18px var(--font);color:var(--muted)}
.recap-val{font:600 16px/24px var(--font);color:var(--ink)}
.recap-sub{font:400 14px/20px var(--font);color:var(--muted)}
.recap-row .btn-link{min-height:44px;margin:-10px -2px -10px 0;font-size:14px}
.policy{display:grid;gap:10px;margin-top:20px}
.policy li{display:flex;gap:10px;align-items:flex-start;font:400 15px/22px var(--font);color:var(--ink)}
.policy .ico{color:var(--cta);margin-top:1px}

/* ===== Riepilogo laterale (desktop) ===== */
.summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px}
.summary-title{font:600 16px/24px var(--font);color:var(--navy);margin-bottom:4px}
.sum-list{display:grid}
.sum-row{display:flex;gap:12px;padding:12px 0;align-items:flex-start}
.sum-row + .sum-row{border-top:1px solid var(--border)}
.sum-row .ico{color:var(--navy);margin-top:2px}
.sum-row.is-empty .ico{color:var(--decor)}
.sum-label{font:500 13px/18px var(--font);color:var(--muted)}
.sum-val{font:600 15px/22px var(--font);color:var(--ink)}
.sum-row.is-empty .sum-val{font-weight:400;color:var(--muted)}
.sum-sub{font:400 14px/20px var(--font);color:var(--muted)}
.side-cta{margin-top:16px}
.side-cta:empty{display:none}
.reassure{display:grid;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.reassure li{display:flex;gap:10px;align-items:flex-start;font:400 14px/20px var(--font);color:var(--muted)}
.reassure .ico{width:16px;height:16px;color:var(--cta);margin-top:2px;stroke-width:2}
.side-help{margin-top:16px;text-align:center;font:400 13px/18px var(--font);color:var(--muted-bg)}
.side-help a{font-weight:500}
.contact-list{display:grid;gap:2px;margin-top:8px}
.contact-list a{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--navy);text-decoration:none;font:500 15px/20px var(--font);border-radius:8px}
.contact-list a:hover{color:var(--cta)}
.contact-list .ico{color:var(--cta)}
.sede-list{display:grid;gap:12px;margin-top:12px}
.sede-list li{display:flex;gap:10px;font:400 14px/20px var(--font);color:var(--muted)}
.sede-list strong{display:block;color:var(--ink);font-weight:600;font-size:15px}
.sede-list .ico{color:var(--navy);margin-top:2px}

/* ===== Benvenuto ===== */
.trust{display:grid;gap:12px;margin-top:28px}
.trust li{display:flex;gap:12px;align-items:center;font:500 15px/22px var(--font);color:var(--ink)}
.trust .icon-tile{width:36px;height:36px;border-radius:9px}
.trust .icon-tile .ico{width:18px;height:18px}
@media (min-width:640px){.trust{grid-template-columns:repeat(3,1fr);gap:16px}.trust li{flex-direction:column;align-items:flex-start;gap:8px;font-size:14px;line-height:20px}}
.link-card{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);transition:border-color var(--dur) var(--ease)}
.link-card:hover{border-color:var(--border-hover);color:var(--ink)}
.link-card .opt-end{margin-left:auto}
.group-title{font:600 13px/18px var(--font);color:var(--muted-bg);margin:24px 0 10px}
.group-title:first-child{margin-top:0}

/* ===== Esito ===== */
.result{text-align:center;padding-top:8px}
.result .title{margin-left:auto;margin-right:auto;max-width:22ch}
.result .subtitle{margin-left:auto;margin-right:auto}
@media (min-width:1024px){.result{text-align:left}.result .title,.result .subtitle{margin-left:0}}
.mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px}
@media (min-width:1024px){.mark{margin-left:0}}
.mark.ok{background:var(--tint);color:var(--cta)}
.mark.wait{background:var(--warn-bg);color:var(--warn)}
.mark.neutral{background:var(--surface);border:1px solid var(--border);color:var(--navy)}
.mark.err{background:var(--err-bg);color:var(--err)}
.mark svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mark.ok .draw{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 420ms 120ms var(--ease) forwards}
.mark.ok{animation:pop 320ms var(--ease)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ticket{margin-top:24px;text-align:left}
.ticket-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.code{font:700 22px/28px var(--font);letter-spacing:.12em;color:var(--navy);font-variant-numeric:tabular-nums}
.ticket .recap-row{padding:14px 0}
.actions{display:grid;gap:12px;margin-top:20px}
@media (min-width:640px){.actions.three{grid-template-columns:1fr 1fr}.actions.three > :first-child{grid-column:1 / -1}}
.menu{margin-top:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:6px;display:grid}
.menu a,.menu button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:8px;text-align:left;color:var(--ink);text-decoration:none;font:500 15px/20px var(--font)}
.menu a:hover,.menu button:hover{background:var(--bg);color:var(--ink)}
.menu .ico{color:var(--navy)}
.menu small{display:block;font:400 13px/18px var(--font);color:var(--muted)}
.timeline{display:grid;margin-top:24px;text-align:left}
.tl-step{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:20px}
.tl-step:last-child{padding-bottom:0}
.tl-step::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--border);border-radius:1px}
.tl-step:last-child::before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border-hover);background:var(--surface);color:var(--muted)}
.tl-dot .ico{width:16px;height:16px;stroke-width:2.25}
.tl-step.done .tl-dot{background:var(--cta);border-color:var(--cta);color:#fff}
.tl-step.done::before{background:var(--accent)}
.tl-step.now .tl-dot{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.tl-title{font:600 15px/22px var(--font);color:var(--ink);padding-top:3px}
.tl-sub{font:400 14px/20px var(--font);color:var(--muted)}
.install-card{display:flex;gap:14px;align-items:center;margin-top:24px;text-align:left}
.app-tile{flex:none;width:48px;height:48px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 17px/1 var(--font);letter-spacing:.02em}
.app-tile.lg{width:64px;height:64px;border-radius:16px;font-size:22px}

/* ===== Le mie prenotazioni ===== */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);margin-bottom:16px}
.tab{flex:1;min-height:44px;border-radius:8px;font:500 15px/20px var(--font);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.tab:hover{color:var(--navy)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
.tab .count{font-variant-numeric:tabular-nums;font-weight:600}
.bk{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;transition:border-color var(--dur) var(--ease)}
.bk:hover{border-color:var(--border-hover)}
.date-tile{flex:none;width:56px;border-radius:var(--r-ctl);background:var(--tint);color:var(--cta);text-align:center;padding:8px 0}
.date-tile.past{background:var(--bg);color:var(--muted)}
.date-tile b{display:block;font:600 22px/26px var(--font);font-variant-numeric:tabular-nums}
.date-tile span{display:block;font:600 13px/16px var(--font);text-transform:lowercase}
.bk-body{flex:1;min-width:0;display:grid;gap:2px}
.bk-when{font:600 16px/24px var(--font);color:var(--ink);font-variant-numeric:tabular-nums}
.bk-what{font:400 14px/20px var(--font);color:var(--muted)}
.bk .badge{margin-top:6px;justify-self:start}
.empty{text-align:center;padding:32px 20px}
.empty .mark{margin-bottom:16px}
.empty .h3{margin-bottom:4px}
.act-list{display:grid;padding:4px 0}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 20px;text-align:left;color:var(--ink);text-decoration:none;font:500 16px/22px var(--font);transition:background-color var(--dur) var(--ease)}
.act + .act,.act-wrap + .act,.act + .act-wrap,.act-wrap + .act-wrap{border-top:1px solid var(--border)}
.act:hover{background:var(--bg);color:var(--ink)}
.act > .ico:first-child{color:var(--navy)}
.act .opt-end{margin-left:auto}
.act[aria-disabled="true"]{color:var(--muted);cursor:not-allowed}
.act[aria-disabled="true"] > .ico:first-child{color:var(--decor)}
.act[aria-disabled="true"]:hover{background:none}
.act small{display:block;font:400 13px/18px var(--font);color:var(--muted)}
.act-wrap .menu{margin:0 20px 16px}
.act-card{padding:0;overflow:clip}
.when-big{font:600 20px/28px var(--font);color:var(--navy);font-variant-numeric:tabular-nums}
.move{display:grid;gap:12px;margin-top:4px}
.move-box{border:1px solid var(--border);border-radius:var(--r-card);padding:14px 16px;background:var(--surface)}
.move-box.old .move-when{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.move-label{font:500 13px/18px var(--font);color:var(--muted)}
.move-when{font:600 17px/24px var(--font);color:var(--ink);font-variant-numeric:tabular-nums}
.move-box.new{border-color:var(--cta);box-shadow:inset 0 0 0 1px var(--cta)}
.move-arrow{justify-self:center;color:var(--decor)}

/* ===== Scheletri di caricamento ===== */
.sk{display:block;background:#edf1f5;border-radius:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.sk-line{height:14px}
.sk-card{height:76px;border-radius:var(--r-card)}
.sk-pill{display:inline-block;width:170px;height:24px;border-radius:var(--r-pill);margin-top:8px}

/* ===== Barra CTA fissa (mobile e tablet) ===== */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);box-shadow:var(--raised);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{max-width:640px;margin:0 auto}
.bar-line{font:500 14px/20px var(--font);color:var(--ink);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bar-line:empty{display:none}
@media (min-width:1024px){.bar{display:none !important}}
@media (max-width:1023px){.main{padding-bottom:calc(var(--bar-h) + 24px)}}

/* ===== Footer: lo studio in alto, Ambulatorio Facile solo qui ===== */
.foot{padding-top:8px;padding-bottom:calc(var(--bar-h) + 28px)}
@media (min-width:1024px){.foot{padding-bottom:40px}}
.foot-in{border-top:1px solid var(--border);padding-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font:400 13px/18px var(--font);color:var(--muted-bg)}
.powered{display:inline-flex;align-items:center;gap:8px}
.af-logo{display:inline-flex;align-items:center;min-height:44px;border-radius:6px}
.af-logo svg{height:18px;width:auto}
.foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:0 16px}
.foot nav a{display:inline-flex;align-items:center;min-height:44px;color:var(--muted-bg);text-decoration:underline}
.foot nav a:hover{color:var(--navy)}
@media (min-width:1024px){.foot-in{flex-direction:row;justify-content:space-between;text-align:left}.foot nav{order:3}}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 16px);transform:translate(-50%,12px);z-index:70;max-width:min(440px,calc(100vw - 32px));width:max-content;background:var(--navy);color:#fff;border-radius:var(--r-ctl);padding:12px 16px;font:500 15px/22px var(--font);display:flex;gap:10px;align-items:flex-start;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ico{margin-top:1px;color:#7fe0c9}
.toast.warn .ico{color:#ffd58a}
@media (min-width:1024px){.toast{bottom:24px}}

/* ===== Offline ===== */
.offline{background:var(--warn-bg);color:var(--warn);font:500 14px/20px var(--font);text-align:center;padding:10px 16px;display:flex;gap:8px;justify-content:center;align-items:center}

/* ===== Bottom sheet (dialog modale; centrato su desktop) ===== */
dialog.sheet{border:0;padding:0;margin:0;color:var(--ink);background:var(--surface);width:100%;max-width:none;max-height:min(92vh,760px);overflow:auto;position:fixed;top:auto;bottom:0;left:0;right:0;border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--raised);overscroll-behavior:contain}
dialog.sheet[open]{animation:sheet-in 240ms var(--ease)}
dialog.sheet::backdrop{background:rgba(8,54,79,.4)}
@keyframes sheet-in{from{transform:translateY(24px);opacity:0}}
@media (min-width:1024px){dialog.sheet{top:0;bottom:0;margin:auto;width:480px;height:fit-content;border-radius:var(--r-card);left:0;right:0}}
.sheet-in{padding:8px 20px calc(20px + env(safe-area-inset-bottom));position:relative}
@media (min-width:1024px){.sheet-in{padding:24px}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border-hover);margin:4px auto 12px}
@media (min-width:1024px){.grab{display:none}}
.sheet-x{position:absolute;right:8px;top:8px}
.sheet-head{padding-right:40px;margin-bottom:8px}
.sheet-text{font:400 15px/22px var(--font);color:var(--muted);margin-bottom:16px}
.sheet-actions{display:grid;gap:12px;margin-top:20px}
.seg-ctl{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:var(--r-ctl);margin-bottom:16px}
.seg-ctl button{flex:1;min-height:44px;border-radius:8px;font:500 15px/20px var(--font);color:var(--muted)}
.seg-ctl button[aria-selected="true"]{background:var(--surface);color:var(--navy);box-shadow:0 0 0 1px var(--border)}
.steps{display:grid;gap:12px;counter-reset:passo}
.steps li{display:flex;gap:12px;align-items:center;font:400 15px/22px var(--font)}
.steps li > b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--cta);display:grid;place-items:center;font:600 14px/1 var(--font)}
.steps .glyph{flex:none;margin-left:auto;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);display:grid;place-items:center;color:var(--info)}
.steps .glyph .mini-tile{width:24px;height:24px;border-radius:6px;background:var(--navy);color:#fff;font:600 10px/24px var(--font);text-align:center}

/* ===== Transizione tra schermate ===== */
.screen.enter{animation:enter 220ms var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

/* ===== Pannello DEMO: volutamente fuori dal design (grigio, monospazio, tratteggiato) ===== */
.demo{position:fixed;left:12px;bottom:calc(var(--bar-h) + 12px);z-index:80;font:12px/16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#334155}
@media (min-width:1024px){.demo{bottom:12px}}
.demo-toggle{height:36px;padding:0 12px;border:1px dashed #94a3b8;border-radius:8px;background:#eceff3;color:#334155;font:inherit;font-weight:600;opacity:.92}
.demo-toggle:hover{opacity:1}
.demo-panel{width:min(312px,calc(100vw - 24px));max-height:min(78vh,640px);overflow:auto;overscroll-behavior:contain;border:1px dashed #94a3b8;border-radius:10px;background:#eceff3;padding:12px}
.demo-panel h3{font:inherit;font-weight:700;margin:14px 0 4px;padding-top:10px;border-top:1px dashed #94a3b8}
.demo-panel .dsez{margin-top:12px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#f4f6f8}
.demo-panel .dsez > h3:first-child{margin-top:0;padding-top:0;border-top:0}
.demo-panel .dsub2{color:#475569;margin:2px 0 4px}
.demo-presets{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.demo-presets .dbtn{width:auto;margin-top:0;padding:0 8px}
.demo-passi{display:grid;gap:2px;margin-top:4px}
.demo-passi li{display:flex;align-items:center;gap:4px;min-height:32px;padding:0 4px;background:#fff;border:1px solid #cbd5e1;border-radius:6px}
.demo-passi li.spento{background:transparent;border-style:dashed}
.demo-passi .dnum{flex:none;width:18px;text-align:right;color:#475569}
.demo-passi label{flex:1;min-width:0;display:flex;align-items:center;gap:6px;cursor:pointer}
.demo-passi .dmini{flex:none;width:28px;height:28px;border:1px solid #94a3b8;border-radius:6px;background:#fff;font:inherit;line-height:1}
.demo-passi .dmini[disabled]{opacity:.35;cursor:not-allowed}
.demo-panel label.dsel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.demo-panel label.dsel select{width:auto;max-width:150px;min-height:30px}
.demo-panel select:disabled{opacity:.5}
.demo-msg{margin-top:8px;padding:6px 8px;border-radius:6px;background:#fff;border:1px solid #b42318;color:#9a1d14}
.demo-msg.avviso{border-color:#8a5600;color:#6b4300}
.demo-msg p + p{margin-top:4px}
.demo-panel h2{font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.demo-panel p.dsub{color:#475569;margin-bottom:10px}
.demo-row{display:grid;gap:4px;margin-top:10px}
.demo-row > span{font-weight:600}
.demo-panel select{width:100%;min-height:36px;border:1px solid #94a3b8;border-radius:6px;background:#fff;font:inherit;padding:0 6px}
.demo-panel label.dck{display:flex;gap:8px;align-items:flex-start;min-height:28px;padding:4px 0;cursor:pointer}
.demo-panel input{accent-color:#475569;margin:1px 0 0}
.demo-panel .dbtn{width:100%;min-height:34px;margin-top:6px;border:1px solid #94a3b8;border-radius:6px;background:#fff;font:inherit;text-align:left;padding:0 10px}
.demo-panel .dbtn:hover{background:#f8fafc}
.demo-panel .dbtn[disabled]{opacity:.5;cursor:not-allowed}
.demo-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.demo-head button{width:32px;height:32px;border:1px solid #94a3b8;border-radius:6px;background:#fff;font:inherit;font-size:16px;line-height:1}
.demo-hint{margin-top:12px;border:1px dashed #94a3b8;background:#eceff3;color:#334155;border-radius:8px;padding:8px 10px;font:12px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.demo-hint b{font-weight:700}
.demo-hint button{font:inherit;text-decoration:underline;color:#0f3a52;min-height:28px;padding:0 2px}

/* ===== Movimento ridotto ===== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important;scroll-behavior:auto !important}
  .mark.ok .draw{stroke-dashoffset:0}
  .spin{animation:none;border-top-color:currentColor}
  .sk{animation:none}
}

function validaConfig(c, studio = { whatsappCollegato: !!STUDIO.whatsapp, prestazioni: PRESTAZIONI }) {
  const errori = []; const avvisi = [];
  const attivi = c.passi.filter(p => p.attivo).map(p => p.id);
  const pos = id => attivi.indexOf(id);
  const conVerifica = c.verifica.richiesta && attivi.includes('verifica');
  for (const id of ['orario', 'dati', 'riepilogo']) if (!attivi.includes(id)) errori.push(`Il passo "${NOMI_PASSI[id]}" non si può spegnere.`);
  if (c.passi[c.passi.length - 1].id !== 'riepilogo') errori.push('Il riepilogo deve essere l\'ultimo passo.');
  for (const id of ['prestazione', 'professionista', 'sede']) {
    if (attivi.includes(id) && pos('orario') >= 0 && pos(id) > pos('orario')) errori.push(`"${NOMI_PASSI.orario}" deve venire dopo "${NOMI_PASSI[id]}".`);
  }
  if (conVerifica && pos('dati') >= 0 && pos('dati') < pos('verifica')) errori.push('"I tuoi dati" deve venire dopo la verifica: chi è già paziente trova i dati compilati.');
  if (!attivi.includes('prestazione') && !c.scelte.prestazione_predefinita) errori.push('Con il passo Prestazione spento serve una prestazione predefinita.');
  if (!c.scelte.primo_disponibile && !attivi.includes('professionista') && !c.scelte.professionista_predefinito
      && studio.prestazioni.some(p => p.professionisti.length > 1)) errori.push('Senza "Il primo disponibile" e con il passo Professionista spento serve un professionista predefinito.');
  if (c.verifica.richiesta && attivi.includes('verifica') && !c.verifica.metodi.length) errori.push('Con la verifica attiva serve almeno un metodo (WhatsApp, email o SMS).');
  if (c.verifica.metodi.includes('whatsapp') && !studio.whatsappCollegato) errori.push('Per verificare con WhatsApp lo studio deve avere il numero WhatsApp collegato al gestionale.');
  if (c.accesso.modalita === 'archivio' && !conVerifica) errori.push('"Solo pazienti già in archivio" non è ammessa senza verifica: non si può sapere chi è davvero.');
  if (!conVerifica && c.senza_verifica.recapito === 'facoltativo') avvisi.push('Senza verifica e senza recapito obbligatorio lo studio non potrà avvisare il paziente se l\'appuntamento cambia.');

  if (!conVerifica && !c.verifica.metodi.length) avvisi.push('Nessun metodo di verifica: "Le mie prenotazioni" sparisce, si sposta e si annulla dal link nei messaggi.');
  return { errori, avvisi };
}

/* ==========================================================================
   2. DATE (tutto in ora di Roma; le date sono stringhe ISO "AAAA-MM-GG")
   ========================================================================== */

const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const GIORNI_BREVI = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MESI_BREVI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];

const pad = n => String(n).padStart(2, '0');
// Mai new Date("AAAA-MM-GG"): sarebbe mezzanotte UTC. Si costruisce coi componenti locali.
const isoDi = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const daIso = s => { const [y, m, g] = s.split('-').map(Number); return new Date(y, m - 1, g); };
const piuGiorni = (s, n) => { const d = daIso(s); d.setDate(d.getDate() + n); return isoDi(d); };
const diffGiorni = (a, b) => Math.round((daIso(b) - daIso(a)) / 86400000);
const OGGI_ISO = isoDi(OGGI);

const dataLunga = s => { const d = daIso(s); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`; };   // giovedì 12 novembre
const dataLungaAnno = s => `${dataLunga(s)} ${daIso(s).getFullYear()}`;                                               // giovedì 12 novembre 2026
const dataMedia = s => { const d = daIso(s); return `${GIORNI_BREVI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`; }; // mar 3 novembre
const dataBreve = s => { const d = daIso(s); return `${GIORNI_BREVI[d.getDay()]} ${d.getDate()} ${MESI_BREVI[d.getMonth()]}`; }; // gio 12 nov
const giornoMese = s => { const d = daIso(s); return `${d.getDate()} ${MESI[d.getMonth()]}`; };                       // 12 novembre
const meseAnno = s => { const d = daIso(s); return `${MESI[d.getMonth()]} ${d.getFullYear()}`; };
const maiuscola = s => s.charAt(0).toUpperCase() + s.slice(1);
const minutiDi = ora => { const [h, m] = ora.split(':').map(Number); return h * 60 + m; };
const oraDi = min => `${Math.floor(min / 60)}:${pad(min % 60)}`;
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const fasciaDi = ora => (minutiDi(ora) < 13 * 60 ? 'Mattina' : minutiDi(ora) < 18 * 60 + 30 ? 'Pomeriggio' : 'Sera');

function traQuanto(iso) {
  const n = diffGiorni(OGGI_ISO, iso);
  if (n < 0) return '';
  if (n === 0) return 'oggi';
  if (n === 1) return 'domani';
  return `tra ${n} giorni`;
}
// Fuso di Roma per i link Outlook: +02:00 dall'ultima domenica di marzo all'ultima di ottobre.
function offsetRoma(iso) {
  const y = Number(iso.slice(0, 4));
  const ultimaDomenica = m => { const d = new Date(y, m + 1, 0); d.setDate(d.getDate() - d.getDay()); return isoDi(d); };
  return iso >= ultimaDomenica(2) && iso < ultimaDomenica(9) ? '+02:00' : '+01:00';
}

    db.idempotenza = {};        // Idempotency-Key -> risposta già data
    db.occupatiDaAltri = new Set();
    db.sessione = null;         // in produzione: cookie firmato del dispositivo, valido 30 giorni
    db.primoRef = true;         // la prima prenotazione della demo ha il codice K7P2QH
  }
  inizializza();

  const risposta = (status, body) => ({ status, body });
  const copia = o => JSON.parse(JSON.stringify(o));
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function casuale(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, '0')).join(''); }
  function nuovoRef() { // 6 caratteri leggibili, senza 0/O/1/I
    const alfabeto = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r = '';
    const a = new Uint8Array(6); crypto.getRandomValues(a);
    for (const b of a) r += alfabeto[b % alfabeto.length];
    return r;
  }
  const chiaveSlot = s => `${s.professionista}|${s.sede}|${s.data}|${s.ora}`;
  const attiva = p => p.stato === 'confermata' || p.stato === 'in_attesa';
  const modalita = () => db.pagina.accesso.modalita;
  const conVerifica = () => db.pagina.verifica.richiesta && db.pagina.passi.some(p => p.id === 'verifica' && p.attivo);
  const maxAttive = () => db.pagina.limiti.attive_per_recapito;
  // Metodi di verifica disponibili adesso: raggiunto il tetto giornaliero, l'SMS sparisce fino al giorno dopo.
  const metodiOggi = () => db.pagina.verifica.metodi.filter(m => m !== 'sms' || db.smsOggi < db.pagina.verifica.sms_tetto_giornaliero);

  // Cosa lo studio rende prenotabile online. Il pannello demo può simulare uno studio con un solo
  // professionista (Dott.ssa Conti) e una sola sede (Empoli).
  function vista() {
    if (!db.demo.unico) return { sedi: Object.values(SEDI), professionisti: Object.values(PROFESSIONISTI), prestazioni: PRESTAZIONI };
    const pro = ['conti']; const sedi = ['empoli'];
    return {
      sedi: sedi.map(id => SEDI[id]),
      professionisti: pro.map(id => PROFESSIONISTI[id]),
      prestazioni: PRESTAZIONI.filter(p => p.professionisti.some(x => pro.includes(x)) && p.sedi.some(s => sedi.includes(s)))
        .map(p => ({ ...p, professionisti: p.professionisti.filter(x => pro.includes(x)), sedi: p.sedi.filter(s => sedi.includes(s)) })),
    };
  }

  function occupato(pro, sede, data, ora) {
    if (db.occupatiDaAltri.has(`${pro}|${sede}|${data}|${ora}`)) return true;
    return db.prenotazioni.some(p => attiva(p) && p.professionista === pro && p.sede === sede && p.data === data && p.ora === ora);
  }

  // Orari liberi di un professionista in una sede in un giorno.
  function orariAgenda(pro, sede, iso) {
    const ag = AGENDE[pro]; const s = ag && ag.sedi[sede];
    const dow = daIso(iso).getDay();
    if (dow === 0 || dow === 6 || FESTIVI.includes(iso)) return { stato: 'chiuso', orari: [] };
    if (iso > piuGiorni(OGGI_ISO, db.config.finestraGiorni)) return { stato: 'fuori', orari: [] };
    if (!s || !s.giorni.includes(dow)) return { stato: 'nessuno', orari: [] };
    if (iso <= OGGI_ISO) return { stato: 'completo', orari: [] }; // oggi: preavviso minimo di 2 ore già superato alle 20:40
    const chiave = `${pro}|${sede}`;
    const fisse = AGENDE_FISSE[chiave];
    let orari;
    if (fisse && fisse[iso]) orari = fisse[iso].slice();
    else if (iso < ag.liberaDal) orari = [];
    else orari = (s.orari || ORARI_STANDARD).filter(o => hash(chiave + iso + o) % 100 < 42);
    orari = orari.filter(o => !occupato(pro, sede, iso, o));
    return { stato: orari.length === 0 ? 'completo' : orari.length <= 3 ? 'pochi' : 'posti', orari };
  }

  // Unisce più professionisti e sedi (serve per "Il primo disponibile").
  function giorno(pres, pros, sedi, iso) {
    const mappa = new Map(); const stati = [];
    for (const pro of pros) for (const sede of sedi) {
      if (!AGENDE[pro] || !AGENDE[pro].sedi[sede]) continue;
      const g = orariAgenda(pro, sede, iso); stati.push(g.stato);
      for (const ora of g.orari) if (!mappa.has(ora)) mappa.set(ora, { ora, professionista: pro, sede });
    }
    const orari = [...mappa.values()].sort((a, b) => minutiDi(a.ora) - minutiDi(b.ora));
    let stato;
    if (orari.length) stato = orari.length <= 3 ? 'pochi' : 'posti';
    else if (stati.length && stati.every(s => s === 'chiuso')) stato = 'chiuso';
    else if (stati.includes('fuori')) stato = 'fuori';
    else if (stati.includes('completo')) stato = 'completo';
    else stato = 'nessuno';
    return { stato, orari };
  }

  // I 3 orari liberi più vicini a quello richiesto (risposta del 409).
  function alternative(r) {
    const base = diffGiorni(OGGI_ISO, r.data) * 1440 + minutiDi(r.ora); const out = [];
    for (let k = -3; k <= 10; k++) {
      const iso = piuGiorni(r.data, k); if (iso <= OGGI_ISO) continue;
      for (const ora of orariAgenda(r.professionista, r.sede, iso).orari) {
        if (iso === r.data && ora === r.ora) continue;
        out.push({ data: iso, ora, professionista: r.professionista, sede: r.sede, d: Math.abs(diffGiorni(OGGI_ISO, iso) * 1440 + minutiDi(ora) - base) });
      }
    }
    return out.sort((a, b) => a.d - b.d).slice(0, 3)
      .sort((a, b) => (a.data + pad(minutiDi(a.ora))).localeCompare(b.data + pad(minutiDi(b.ora))))
      .map(({ d, ...x }) => x);
  }

  // ----- Endpoint -----

  function catalogo() {
    const v = vista();
    // La configurazione pubblicata, già validata. I metodi di verifica sono quelli disponibili adesso.
    const config = copia(db.pagina);
    config.verifica.metodi = metodiOggi();
    return risposta(200, {
      studio: { nome: STUDIO.nome, telefono: STUDIO.telefono, whatsapp: STUDIO.whatsapp, email: STUDIO.email },
      config,
      prenotazioni_attive: !db.config.sospese,
      modalita: modalita(),
      regole: { max_attive: maxAttive(), finestra_giorni: db.config.finestraGiorni, preavviso_sposta_ore: db.config.preavvisoSpostaOre, riserva_minuti: db.config.riservaMinuti, scadenza_richiesta_ore: db.pagina.accesso.ore_scadenza_richieste },
      // Modalità d: il link personale firmato porta già prestazione, professionista e sede.
      invito: modalita() === 'invito' ? { nome: 'Rosa', prestazione: 'derm', professionista: 'conti', sede: 'empoli', valido_fino: '2026-11-30' } : null,
      sedi: v.sedi,
      // Solo nome, qualifica e sedi: mai email o cellulare dei medici (brief §6.6 punto 5).
      professionisti: v.professionisti.map(({ id, titolo, nome, cognome, qualifica, sedi }) => ({ id, titolo, nome, cognome, qualifica, sedi })),
      prestazioni: v.prestazioni,
    });
  }

  function disponibilita(q) {
    const pres = vista().prestazioni.find(p => p.id === q.prestazione);
    if (!pres) return risposta(400, { errore: 'prestazione_non_valida' });
    const pros = q.professionista && q.professionista !== 'primo' ? [q.professionista] : pres.professionisti;
    const sedi = q.sede ? [q.sede] : pres.sedi;
    if (q.prima_disponibilita) {
      const fine = piuGiorni(OGGI_ISO, db.config.finestraGiorni);
      for (let iso = q.dal || piuGiorni(OGGI_ISO, 1); iso <= fine; iso = piuGiorni(iso, 1)) {
        const g = giorno(pres, pros, sedi, iso);
        if (g.orari.length) return risposta(200, { primo: { data: iso, ...g.orari[0] } });
      }
      return risposta(200, { primo: null });
    }
    if (diffGiorni(q.dal, q.al) > 13) return risposta(400, { errore: 'intervallo_troppo_ampio', massimo_giorni: 14 });
    const giorni = {};
    for (let iso = q.dal; iso <= q.al; iso = piuGiorni(iso, 1)) giorni[iso] = giorno(pres, pros, sedi, iso);
    return risposta(200, { giorni });
  }

  // Riserva: possibile SOLO con il numero verificato. Toccare un orario prima non blocca nulla.
  function riserva(c) {
    if (db.config.sospese) return risposta(503, { errore: 'prenotazioni_sospese' });
    if (!db.sessione) return risposta(401, { errore: 'numero_non_verificato' });
    const paziente = db.pazienti[db.sessione];
    if (modalita() === 'archivio' && !paziente) return risposta(403, { errore: 'solo_pazienti_in_archivio' });
    const attive = db.prenotazioni.filter(p => p.cellulare === db.sessione && attiva(p) && p.data >= OGGI_ISO);
    if (db.demo.limite || attive.length >= maxAttive()) return risposta(422, { errore: 'limite_raggiunto', massimo: maxAttive() });
    const stessa = attive.find(p => p.prestazione === c.prestazione);
    if (stessa) return risposta(409, { errore: 'prestazione_gia_prenotata', prenotazione: copia(stessa) });
    if (occupato(c.professionista, c.sede, c.data, c.ora)) return risposta(409, { errore: 'slot_non_disponibile', alternative: alternative(c) });
    for (const t in db.riserve) if (db.riserve[t].sessione === db.sessione) delete db.riserve[t];
    const token = casuale(16);
    const scade_il = Date.now() + db.config.riservaMinuti * 60000;
    db.riserve[token] = { ...c, sessione: db.sessione, scade_il };
    return risposta(201, { token, scade_il });
  }

  function rilascia(token) { delete db.riserve[token]; return risposta(204, {}); }

  // Verifica dell'identità: lo studio sceglie quali metodi accendere (config.verifica.metodi, nell'ordine mostrato).
  // metodo 'whatsapp': il PAZIENTE scrive allo studio un messaggio già pronto con un codice di 4 cifre;
  //   il gateway WhatsApp riceve il messaggio in entrata, abbina numero mittente e codice e segna la verifica. Costo zero.
  // metodo 'email': codice di 6 cifre all'indirizzo indicato (10 minuti, 5 tentativi). Domini usa e getta bloccati.
  // metodo 'sms' (spento di default): codice di 6 cifre al cellulare, 10 minuti, 5 tentativi, inviato col modulo SMS
  //   dei promemoria e pagato a consumo sul credito dello studio. Contro l'SMS pumping: Turnstile prima dell'invio,
  //   solo cellulari italiani, 3 invii per numero e 10 per IP all'ora, tetto giornaliero per studio
  //   (verifica.sms_tetto_giornaliero): raggiunto il tetto il metodo sparisce fino al giorno dopo e la segreteria
  //   riceve un avviso. Testo: "Poliambulatorio Santa Chiara: il tuo codice di verifica è 482193. Vale 10 minuti.
  //   Non condividerlo con nessuno." (niente prestazione, niente nome del paziente).
  function otpInvia(c) {
    const cell = String(c.cellulare || '').replace(/\D/g, '');
    const metodo = METODI_VERIFICA.includes(c.metodo) ? c.metodo : 'whatsapp';
    if (!metodiOggi().includes(metodo)) return risposta(422, { errore: metodo === 'sms' && db.pagina.verifica.metodi.includes('sms') ? 'tetto_sms' : 'metodo_non_attivo' });
    if (!/^3\d{8,9}$/.test(cell)) return risposta(422, { errore: 'cellulare_non_valido' });
    const email = String(c.email || '').trim().toLowerCase();
    if (metodo === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return risposta(422, { errore: 'email_non_valida' });
    if (metodo === 'email' && /@(mailinator|yopmail|10minutemail|guerrillamail|tempmail)\./.test(email)) return risposta(422, { errore: 'email_usa_e_getta' });
    const ora = Date.now();
    if (c.trappola) return risposta(202, { inviato: true, canale: metodo, rimanda_tra_sec: 60 }); // campo trappola pieno: è un bot, si finge l'invio
    if (!c.turnstile_token) return risposta(403, { errore: 'verifica_antibot_fallita' });
    const prec = db.otp[cell];
    if (prec && prec.bloccato_fino > ora) return risposta(423, { errore: 'troppi_tentativi', bloccato_fino: prec.bloccato_fino });
    db.invii[cell] = (db.invii[cell] || []).filter(t => ora - t < 3600000);
    if (db.invii[cell].length >= 3) return risposta(429, { errore: 'troppi_invii' });
    db.invii[cell].push(ora);
    if (metodo === 'whatsapp') {
      const codice = '4821';
      const ref = c.contesto === 'prenota' && db.primoRef && cell === NUMERO_ROSA ? ' K7P2QH' : '';
      const messaggio = c.contesto === 'mie' ? `Accedo alle mie prenotazioni, codice di verifica ${codice}` : `Confermo la prenotazione${ref}, codice di verifica ${codice}`;
      db.otp[cell] = { metodo, codice, messaggio, ricevuto: false, scade_il: ora + 600000, tentativi: 0, bloccato_fino: 0 };
      return risposta(202, { inviato: true, canale: 'whatsapp', messaggio, numero_studio: STUDIO.whatsapp, wa_link: `${STUDIO.waHref}?text=${encodeURIComponent(messaggio)}`, scade_tra_sec: 600 });
    }
    if (metodo === 'sms') {
      db.smsOggi++; // in produzione: SmsService del gestionale, addebito a consumo; al tetto parte l'avviso alla segreteria
      db.otp[cell] = { metodo, codice: '123456', scade_il: ora + 600000, tentativi: 0, bloccato_fino: 0 };
      return risposta(202, { inviato: true, canale: 'sms', rimanda_tra_sec: 60, scade_tra_sec: 600 });
    }
    db.otp[cell] = { metodo, email, codice: '123456', scade_il: ora + 600000, tentativi: 0, bloccato_fino: 0 };
    return risposta(202, { inviato: true, canale: 'email', rimanda_tra_sec: 60, scade_tra_sec: 600 });
  }

  // Webhook del gateway WhatsApp (simulato dal pulsante della demo): arriva il messaggio del paziente.
  function otpWhatsappRicevuto(c) {
    const cell = String(c.cellulare || '').replace(/\D/g, '');
    const o = db.otp[cell];
    if (!o || o.metodo !== 'whatsapp' || Date.now() > o.scade_il) return risposta(410, { errore: 'codice_scaduto' });
    if (!String(c.testo || '').includes(o.codice)) return risposta(422, { errore: 'codice_errato' });
    o.ricevuto = true;
    return risposta(204, {});
  }

  // La pagina chiede ogni pochi secondi se il messaggio WhatsApp è arrivato.
  function otpStato(c) {
    const cell = String(c.cellulare || '').replace(/\D/g, '');
    const o = db.otp[cell];
    if (!o || o.metodo !== 'whatsapp' || Date.now() > o.scade_il) return risposta(410, { errore: 'codice_scaduto' });
    if (!o.ricevuto) return risposta(202, { in_attesa: true });
    delete db.otp[cell];
    db.sessione = cell;
    const p = db.pazienti[cell];
    return risposta(200, { verificato: true, paziente: p ? copia(p) : null });
  }

  function otpVerifica(c) {
    const cell = String(c.cellulare || '').replace(/\D/g, '');
    const o = db.otp[cell]; const ora = Date.now();
    if (!o || o.metodo === 'whatsapp') return risposta(410, { errore: 'codice_scaduto' }); // codice a 6 cifre: email o SMS
    if (o.bloccato_fino > ora) return risposta(423, { errore: 'troppi_tentativi', bloccato_fino: o.bloccato_fino });
    if (ora > o.scade_il) return risposta(410, { errore: 'codice_scaduto' });
    if (String(c.codice) !== o.codice) {
      o.tentativi++;
      if (o.tentativi >= 5) { o.bloccato_fino = ora + 15 * 60000; return risposta(423, { errore: 'troppi_tentativi', bloccato_fino: o.bloccato_fino }); }
      return risposta(422, { errore: 'codice_errato', tentativi_rimasti: 5 - o.tentativi });
    }
    delete db.otp[cell];
    db.sessione = cell;
    const p = db.pazienti[cell];
    return risposta(200, { verificato: true, paziente: p ? copia(p) : null });
  }

  // Prenotazione senza registrazione (config.verifica.richiesta false): nessuna riserva prima, nessun codice.
  // Il blocco dell'orario avviene solo qui, con controllo atomico. Protezioni: Turnstile, campo trappola,
  // 3 prenotazioni per dispositivo e 5 per IP al giorno, massimo attive per recapito, avviso anomalie, Sospendi.
  function creaSenzaVerifica(c, chiave) {
    if (db.config.sospese) return risposta(503, { errore: 'prenotazioni_sospese' });
    if (modalita() === 'archivio') return risposta(403, { errore: 'verifica_obbligatoria' }); // l'editor non lo permette
    if (c.trappola || !c.turnstile_token) return risposta(403, { errore: 'verifica_antibot_fallita' });
    const s = c.slot || {}; const k = c.contatto || {};
    const cell = String(k.cellulare || '').replace(/\D/g, ''); const email = String(k.email || '').trim().toLowerCase();
    const rec = db.pagina.senza_verifica.recapito;
    if (cell && !/^3\d{8,9}$/.test(cell)) return risposta(422, { errore: 'cellulare_non_valido' });
    if ((rec === 'cellulare' && !cell) || (rec === 'email' && !email) || (rec === 'almeno_uno' && !cell && !email)) return risposta(422, { errore: 'recapito_mancante' });
    const pres = vista().prestazioni.find(p => p.id === s.prestazione);
    if (!pres) return risposta(400, { errore: 'prestazione_non_valida' });
    // Limiti per recapito: si contano le prenotazioni attive con lo stesso cellulare o la stessa email.
    const mie = db.prenotazioni.filter(p => attiva(p) && p.data >= OGGI_ISO && ((cell && p.cellulare === cell) || (email && p.email === email)));
    if (db.demo.limite || mie.length >= maxAttive()) return risposta(422, { errore: 'limite_raggiunto', massimo: maxAttive() });
    const stessa = mie.find(p => p.prestazione === s.prestazione);
    if (stessa) return risposta(409, { errore: 'prestazione_gia_prenotata', prenotazione: copia(stessa) });
    if (db.demo.orarioPreso) { db.demo.orarioPreso = false; db.occupatiDaAltri.add(chiaveSlot(s)); return risposta(409, { errore: 'slot_non_disponibile', alternative: alternative(s) }); }
    if (occupato(s.professionista, s.sede, s.data, s.ora)) return risposta(409, { errore: 'slot_non_disponibile', alternative: alternative(s) });
    // In approvazione TUTTE le prenotazioni senza verifica sono richieste: il numero in archivio è solo un indizio.
    const stato = modalita() === 'approvazione' ? 'in_attesa' : 'confermata';
    const p = {
      ref: db.primoRef ? 'K7P2QH' : nuovoRef(), cellulare: cell || null, stato, verificata: false,
      prestazione: s.prestazione, professionista: s.professionista, sede: s.sede, data: s.data, ora: s.ora, durata: pres.durata,
      paziente: c.paziente, prenotante: c.prenotante || null, canale: c.canale, email: email || null,
      creata_il: Date.now(), ics_sequence: 0,
      scade_richiesta_il: stato === 'in_attesa' ? Date.now() + db.pagina.accesso.ore_scadenza_richieste * 3600000 : null,
      indizio_archivio: !!(cell && db.pazienti[cell]),
    };
    db.primoRef = false;
    db.prenotazioni.push(p);
    if (stato === 'in_attesa') db.inAttesa = { ...c.anagrafica, canale: c.canale };
    const body = { prenotazione: copia(p) };
    if (chiave) db.idempotenza[chiave] = body;
    return risposta(201, body);
  }

  function crea(c, chiave) {
    if (chiave && db.idempotenza[chiave]) return risposta(200, db.idempotenza[chiave]); // doppio tocco o rete instabile: stessa risposta
    if (!conVerifica()) return creaSenzaVerifica(c, chiave);
    const r = db.riserve[c.riserva];
    if (!r || r.sessione !== db.sessione || Date.now() > r.scade_il) { delete db.riserve[c.riserva]; return risposta(410, { errore: 'riserva_scaduta' }); }
    // Controllo atomico finale. In produzione: GET_LOCK + SELECT ... FOR UPDATE + saveAppointment (brief §6.1).
    if (db.demo.orarioPreso) {
      db.demo.orarioPreso = false; db.occupatiDaAltri.add(chiaveSlot(r)); delete db.riserve[c.riserva];
      return risposta(409, { errore: 'slot_non_disponibile', alternative: alternative(r) });
    }
    if (occupato(r.professionista, r.sede, r.data, r.ora)) return risposta(409, { errore: 'slot_non_disponibile', alternative: alternative(r) });
    const inArchivio = !!db.pazienti[db.sessione];
    const stato = modalita() === 'approvazione' && !inArchivio ? 'in_attesa' : 'confermata';
    const pres = PRESTAZIONI.find(p => p.id === r.prestazione);
    const p = {
      ref: db.primoRef && db.sessione === NUMERO_ROSA ? 'K7P2QH' : nuovoRef(), cellulare: db.sessione, stato, verificata: true,
      prestazione: r.prestazione, professionista: r.professionista, sede: r.sede, data: r.data, ora: r.ora, durata: pres.durata,
      paziente: c.paziente, prenotante: c.prenotante || null, canale: c.canale, email: c.email || null,
      creata_il: Date.now(), ics_sequence: 0,
      scade_richiesta_il: stato === 'in_attesa' ? Date.now() + db.pagina.accesso.ore_scadenza_richieste * 3600000 : null,
    };
    if (db.sessione === NUMERO_ROSA) db.primoRef = false;
    db.prenotazioni.push(p);
    delete db.riserve[c.riserva];
    if (stato === 'confermata' && !inArchivio) db.pazienti[db.sessione] = { ...c.anagrafica, genere: null, canale: c.canale };
    if (stato === 'in_attesa') db.inAttesa = { ...c.anagrafica, canale: c.canale };
    const body = { prenotazione: copia(p) };
    if (chiave) db.idempotenza[chiave] = body;
    return risposta(201, body);

    if (s === 'orario' && !(d.prestazione && d.professionista)) return 'benvenuto';
    return null;
  }
  switch (s) {
    case 'esito':
      if (d.esito && d.esito.stato === 'annullata') { state.draft = nuovaBozza(d); return 'benvenuto'; }
      return d.esito ? null : 'benvenuto';
    case 'preso': return state.ui.alternative.length ? null : 'orario';
    case 'mie': case 'dettaglio': case 'sposta': case 'sposta-conferma': case 'annullata':
      return verificato() ? null : conMiePrenotazioni() ? 'mie-accesso' : 'benvenuto';
    case 'mie-codice': return state.ui.otp.inviato && state.ui.otp.contesto === 'mie' ? null : 'mie-accesso';
    case 'mie-accesso': return verificato() ? 'mie' : conMiePrenotazioni() ? null : 'benvenuto';
    case 'contatto-ok': return state.ui.contattoInviato ? null : 'contatto';
    default: return null;
  }
}

// Barra di avanzamento: conta solo i passi mostrati davvero. Passi vicini dello stesso gruppo diventano un
// segmento solo (professionista e sede; per chi, verifica e dati sono "I tuoi dati").
const ETICHETTE_PASSI = { prestazione: 'Prestazione', professionista: 'Professionista', sede: 'Sede', orario: 'Orario', perchi: 'Per chi', verifica: 'I tuoi dati', dati: 'I tuoi dati', riepilogo: 'Conferma' };
function segmenti() {
  const segs = [];
  for (const p of cfg().passi) {
    if (!p.attivo && p.id !== 'riepilogo') continue;
    const mostrato = p.id === 'verifica' ? verificaRichiesta() : SCELTE.includes(p.id) ? serve(p.id) : true;
    if (!mostrato) continue;
    const label = ETICHETTE_PASSI[p.id]; const prec = segs[segs.length - 1];
    const unisci = prec && (prec.label === label || (prec.label === 'Professionista' && label === 'Sede')
      || (prec.label === 'Per chi' && label === 'I tuoi dati') || (prec.label === 'I tuoi dati' && label === 'Per chi'));
    if (unisci) { prec.passi.push(p.id); if (prec.label === 'Per chi') prec.label = label; } else segs.push({ label, passi: [p.id] });
  }
  return segs;
}
// Segmento della schermata corrente (1 = primo). Se il passo non è contato, vale il segmento successivo.
function segmentoCorrente(segs, s) {
  const passo = passoDellaSchermata(s);
  const i = segs.findIndex(g => g.passi.includes(passo));
  if (i >= 0) return i + 1;
  const pos = posPasso(passo);
  const dopo = segs.findIndex(g => g.passi.some(id => posPasso(id) > pos));
  return dopo >= 0 ? dopo + 1 : segs.length;
}

function specialitaDi(lista) { return SPECIALITA.filter(s => lista.some(p => p.specialita === s)); }
function filtraPrestazioni() {
  const q = norm(state.ui.query.trim()); const base = prestazioniPossibili();

  const d = state.draft; const parti = [];
  if (d.data && d.ora) parti.push(`${dataBreve(d.data)}, ${d.ora}`);
  else if (d.prestazione) parti.push(prestazione(d.prestazione).nome);

    api.disponibilita({ prestazione: pres, professionista: pro, sede, prima_disponibilita: 1 })
      .then(r => { state.cache.primi.set(k, r.primo); ridisegnaSe(['professionista', 'sede']); })
